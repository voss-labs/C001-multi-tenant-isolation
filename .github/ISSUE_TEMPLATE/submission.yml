name: Submission
description: Submit your C001 solution for review. One per person.
title: "Submission: YOUR-USERNAME"
labels: ["submission", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Read [SUBMISSION.md](https://github.com/voss-labs/C001-multi-tenant-isolation/blob/main/docs/SUBMISSION.md) before filling this in.

        You can submit early. Until submissions close you can update the commit SHA by editing this issue. After close, a maintainer posts a `Frozen: <sha>` comment with the SHA in this issue at the deadline, and that commit is the one reviewed.
  - type: input
    id: repository
    attributes:
      label: Repository
      description: Your public repository. Not a fork of this one.
      placeholder: https://github.com/YOUR-USERNAME/c001-multi-tenant-isolation
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: The full 40-character SHA from `git rev-parse HEAD`, already pushed to a branch. This SHA is what gets reviewed; the `c001-submission` tag is a convenience.
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Stack
      description: Language, framework and database, with versions.
    validations:
      required: true
  - type: dropdown
    id: tenancy-model
    attributes:
      label: Tenancy model
      options:
        - Shared tables with a tenant column
        - Schema per tenant
        - Database per tenant
        - Other, explained in SOLUTION.md
    validations:
      required: true
  - type: input
    id: second-layer
    attributes:
      label: Second enforcement layer
      description: One line. What blocks a cross-tenant query when the application-level check is missing? (ISO-09)
    validations:
      required: true
  - type: input
    id: start-command
    attributes:
      label: Start command
      description: Exactly as written in your README.
    validations:
      required: true
  - type: input
    id: test-command
    attributes:
      label: Test command
      description: Exactly as written in your README.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Three to five sentences on how your design keeps tenants apart.
    validations:
      required: true
  - type: textarea
    id: ai-use
    attributes:
      label: AI use
      description: Which tools you used and for what. "None" is a valid answer.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: My repository is public, is not a fork of this one, and has an open-source license.
          required: true
        - label: It starts from a clean clone with the start command above, loads the standard fixture, and has a command that resets to it.
          required: true
        - label: My second enforcement layer is enforced below my application code, not by an ORM or repository filter.
          required: true
        - label: Every scenario in TEST_MATRIX.md has an automated test, mapped by ID in SOLUTION.md.
          required: true
        - label: The test command runs against the real database and exits non-zero on failure.
          required: true
        - label: SOLUTION.md is complete, including Known limitations.
          required: true
        - label: This is my own work and I can walk a reviewer through any part of it.
          required: true
        - label: My start command, build and tests do nothing beyond running this submission.
          required: true
        - label: I accept that other participants will attack my frozen commit, on their own machines, during the break round.
          required: true
