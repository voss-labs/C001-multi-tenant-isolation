name: Break report
description: Report a tenant isolation break in another participant's submission. Break round only.
title: "Break: TARGET-USERNAME, ONE-LINE SUMMARY"
labels: ["break-report", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [break round rules](https://github.com/voss-labs/C001-multi-tenant-isolation/blob/main/docs/EVALUATION.md#break-round) first. Reports filed outside the break round are closed as invalid.

        Run the target inside a disposable virtual machine that holds none of your credentials. Attack only the frozen commit, running there. Never attack anything deployed.

        A report is judged as filed. To correct it, post the correction as a comment; the report then dates from that comment.
  - type: input
    id: target
    attributes:
      label: Target submission
      description: The submission issue you attacked.
      placeholder: "#12"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA tested
      description: Must match the Frozen comment on the target submission issue.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity you are claiming
      description: The maintainer confirms or adjusts it.
      options:
        - "Critical: read or changed another tenant's data"
        - "High: learned about another tenant, escalated a role, or kept access after removal"
        - "Medium: fail-closed or second-layer gap without demonstrated cross-tenant impact"
        - "Low: hardening gap"
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Requirement broken
      description: The ISO ID, and the ATK scenario if one covers it. Write "not in the matrix" if it is a new attack.
      placeholder: ISO-06, ATK-11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Every step from a clean start at the frozen commit with the standard fixture. Exact HTTP requests, as fixture users or users you registered. For ISO-09 or ISO-10 findings only, include the scoping patch or the direct database query with the runtime identity.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: The response or state you observed, and what the specification required instead.
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Likely cause
      description: Optional. Where in their code you think it goes wrong.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I ran the target in a disposable environment holding none of my credentials, and attacked nothing else.
          required: true
        - label: I reproduced this from a clean start with the standard fixture.
          required: true
        - label: I did not set tenant context myself, use a database owner or superuser identity, or edit the second layer.
          required: true
        - label: This is not my own submission, and I have not coordinated it with its author.
          required: true
