name: Freeze submissions

on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Record the head of every open submission
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list -R "$REPO" --state open --label submission --limit 1000 --json number,headRefOid \
            --jq '.[] | "\(.number) \(.headRefOid)"' |
          while read -r number sha; do
            gh api -X POST "repos/$REPO/issues/$number/comments" -f "body=Frozen: $sha" > /dev/null
            echo "#$number frozen at $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          done
