name: Test

on:
  push:
    branches: [main]
    paths: ["scripts/**", "test/**"]
  pull_request:
    paths: ["scripts/**", "test/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the layout checker tests
        run: node --test test/*.test.mjs
